# Configuration for cviu_revision.py (see CVIU_REVISION_PLAN.md).
# Every key is optional; missing keys fall back to DEFAULT_CONFIG in the script.

data:
  scared: /workspace/ENDOVIS
  hamlyn: /workspace/HAMLYN
  c3vd:   /workspace/C3VD

mpvit_weights:                  # ImageNet MPViT-small .pth for the MonoViT rows, if it is not
                                # already in <pretrained_path>/mpvit_small.pth (see the note in
                                # train: below -- the official download link is dead)
log_dir: ./logs                 # where train_end_to_end.py writes <model_name>/models/weights_*
out_dir: ./results/cviu         # everything this script produces
pretrained_path: ./pretrained_model
python: python                  # interpreter used for the training subprocesses
num_workers: 4

train:
  # appended to every run; the run's own flags come after and win on conflicts
  common_flags: "--num_epochs 20 --batch_size 8 --learn_intrinsics True --wandb_mode offline"
  seeds: [314]                  # single-seed runs
  multi_seeds: [314, 1, 2]      # runs listed below get all three
  # runs that carry a claim need three seeds; the launcher only trains the missing ones
  # M-local/M-none/M-global are MonoIIF as published (lambda1 = 0.5, no HADepth term); every
  # E/C/D/R run used the repo default lambda1 = 0.1, below the paper's tested range
  multi_seed_runs: [E3, E4, E7, E8, C0, C1, R1, R2, D3, M-local, M-none, M-global,
                    L025, L100, L200, E8-DVLoRA, E8-IIF, C2-sup, C1-lora,
                    MonoII, MonoViT, MonoViT-II, MonoII-none, MonoII-glob,
                    A-MonoII-none, A-MonoII-glob, A-MonoII]
  checkpoint: best              # best = highest saved weights_<epoch> (saved only on RMSE improvement) | last
  runs: {}                      # add or override grid entries, e.g. C2a: {desc: "...", flags: "..."}
  skip_runs: []                 # grid entries not to train, e.g. [N0, D3-EndoDAC]
  # D3 / D3-EndoDAC use --backbone_weights da3 (DA3-Base, ported code, same env as the grid) and
  # need <pretrained_path>/da3_base.safetensors:
  #   wget -O pretrained_model/da3_base.safetensors https://huggingface.co/depth-anything/DA3-BASE/resolve/main/model.safetensors
  # N0 uses --backbone_weights none (random ViT-B) and needs nothing extra.
  # B-grid (MonoII, MonoViT, MonoViT-II): the competing architectures trained here from scratch
  # under the shared recipe. The MonoViT rows need the ImageNet MPViT-small checkpoint at
  # <pretrained_path>/mpvit_small.pth. The link both the MPViT and MonoViT READMEs give
  # (https://dl.dropbox.com/s/y3dnmmy8h4npz7a/mpvit_small.pth) is DEAD since Dropbox retired the
  # /s/ links, so the train stage looks for a copy already on the machine first -- including
  # /workspace/endo-manydepth/manydepth/mpvit/mpvit_small.pth, the path models/monovit/mpvit.py
  # used to hard-code -- and copies it into pretrained_model/. Point `mpvit_weights` below at it
  # if it lives somewhere else. MonoII needs nothing extra (torchvision's ImageNet ResNet-18).

proposed: E8                    # the MonoIIF row every paired test is against
datasets: [scared, hamlyn, c3vd]
save_pred: true                 # also dump float16 disparities to out_dir/pred/

# Competing methods for Tables 4-6. type: endodac | hadepth | afsfm | endosfml | monovit | npy
methods:
  EndoDAC_MICCAI:
    type: endodac
    weights: ./logs/endodac_fullmodel/models/weights_19
    lora_type: dvlora
    residual_block_indexes: [2, 5, 8, 11]
  AF_SfMLearner:
    type: afsfm
    weights: ./logs/Model_MIA
  # Endo_SfMLearner: {type: endosfml, weights: ./logs/endosfmlearner}
  # MonoViT:         {type: monovit,  weights: ./logs/monovit}
  # HADepth:         {type: hadepth,  weights: ./logs/hadepth/models/weights_19}
  # Monodepth2:
  #   type: npy
  #   kind: disp            # disp | depth
  #   align: median         # median | affine (disparity shift+scale, as mytest_da.py)
  #   files: {scared: ./logs/monodepth2/disps_scared_split.npy}
  # DepthAnything_v1_zeroshot:
  #   type: npy
  #   kind: disp
  #   align: affine
  #   files: {scared: ./disps_endovis_split_DA.npy}

da3:                            # zero-shot rows (stage da3)
  # da3-base runs the ported code from pretrained_model/da3_base.safetensors (no package);
  # other Hugging Face ids need the depth_anything_3 package and are skipped without it
  models: [da3-base, depth-anything/da3mono-large]
  affine_rows: true             # additionally report disparity shift+scale alignment

illum:
  runs: [E8]                    # trained runs analysed by illum-params / illum-sens
  seed: 314
  fit_depth_run: E3             # illum-fit: run whose depth replaces the ground truth when this
                                # SCARED copy has no per-frame scene_points (E3 = baseline, the
                                # least favourable choice for the proposed calibration)
  sequences: [sequence1, sequence2]
  patch_sizes: [64, 32, 16, 8]
  alpha: 0.10                   # LightingDecoder bounds
  beta: 0.05
  ridge: 0.01
  sens_stride: 5                # every k-th pair for the sensitivity sweep
  # keep the perturbations inside what the decoder can express (c in 1+-alpha, b in +-beta):
  # outside that range the ideal response is unreachable and the slope is flattened by clipping
  gains: [0.95, 0.975, 1.0, 1.025, 1.05]
  biases: [-0.03, -0.015, 0.0, 0.015, 0.03]

stats:
  n_boot: 10000
  alpha: 0.05
  min_sequences: 3              # below this, blocks of block_frames replace sequences as the unit
  block_frames: 100
  paired_metrics: [abs_rel, sq_rel, rmse, a1]
  table_methods: null           # order of rows in the main tables; null = all, proposed last
